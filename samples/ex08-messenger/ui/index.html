<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="screen-list" class="screen">
      <h1>メッセージ</h1>
      <ul id="message-list"></ul>
      <div class="compose">
        <input id="receiver-input" type="text" placeholder="宛先(プレイヤーID)">
        <textarea id="body-input" placeholder="本文"></textarea>
        <button id="send-btn">送信</button>
      </div>
      <p id="feedback"></p>
    </div>
    <div id="screen-detail" class="screen hidden">
      <button id="back-btn">← 戻る</button>
      <p id="detail-sender"></p>
      <p id="detail-body"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
